name: ci-cd
on: [push, pull_request]

permissions:
  contents: read

jobs:
  # ---- Gate 1 (S5): no secret enters the repo ----
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---- Gate 2 (S5): SAST on our own code ----
  sast:
    runs-on: ubuntu-latest
    container: { image: semgrep/semgrep }
    steps:
      - uses: actions/checkout@v4
      - run: semgrep scan --config auto --error src/

  # ---- Gate 3 (S4/S5): dependency scan, pinned Trivy IMAGE (not the drifting action) ----
  deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy FS - fail on CRITICAL
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >
          docker run --rm -e GITHUB_TOKEN -v "$PWD:/src" aquasec/trivy:0.76.0
          fs --scanners vuln --severity CRITICAL, HIGH --exit-code 1 /src

  # ---- S6/S7: build the combined image (tests inside), scan it, save it + checksum ----
  build:
    needs: [secret-scan, sast, deps]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (SHA-pinned)
      - name: Build (the 7 tests run inside the build)
        run: docker build --build-arg GIT_SHA="$GITHUB_SHA" -t "shortly:$GITHUB_SHA" .
      - name: Trivy IMAGE gate - fail on fixable HIGH/CRITICAL
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.76.0
          image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "shortly:$GITHUB_SHA"
      - name: Save the image + SHA-256 (build integrity, S4/S5)
        run: |
          docker save "shortly:$GITHUB_SHA" | gzip > image.tgz
          sha256sum image.tgz | tee image.tgz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: shortly-image
          path: |
            image.tgz
            image.tgz.sha256

  # ---- Gate 4 (S5): DAST against the running image (behind nginx+TLS); advisory ----
  dast:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: shortly-image }
      - name: Load + run the image
        run: |
          gunzip -c image.tgz | docker load
          docker run -d --name shortly -p 8443:443 -e ADMIN_TOKEN=ci-token "shortly:$GITHUB_SHA"
          for i in $(seq 1 30); do curl -ks https://localhost:8443/healthz && break || sleep 2; done
      - name: ZAP baseline (DAST over TLS)
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: https://localhost:8443
          fail_action: false
          allow_issue_writing: false

  # ---- S7: verify the checksum, then ship the EXACT image to the VM over SSH, on main ----
  deploy:
    needs: [build, dast]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: shortly-image }
      - name: Verify the image checksum before shipping (anti-tamper, S4/S5)
        run: sha256sum -c image.tgz.sha256
      - name: Copy the image to the VM
        env:
          SSHPASS: ${{ secrets.VM_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          sshpass -e scp -o StrictHostKeyChecking=accept-new image.tgz "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}":~/
      - name: Load + run it on the VM, serve on TLS
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5 (SHA-pinned)
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          password: ${{ secrets.VM_PASSWORD }}
          fingerprint: ${{ secrets.VM_FINGERPRINT }}
          envs: GITHUB_SHA
          script: |
            set -e
            source ~/.lab.env
            gunzip -c ~/image.tgz | docker load
            docker rm -f shortly || true
            docker run -d --name shortly -p "$APP_PORT":443 \
              -v shortly-data:/app/data --env-file ~/shortly.env \
              --security-opt no-new-privileges --memory 256m --pids-limit 200 \
              --restart unless-stopped "shortly:$GITHUB_SHA"
            for i in $(seq 1 20); do
              s=$(docker inspect -f '{{.State.Health.Status}}' shortly 2>/dev/null || echo none)
              echo "health $i: $s"; [ "$s" = healthy ] && break; sleep 3
            done
            for i in $(seq 1 10); do
              code=$(curl -ks -o /dev/null -w '%{http_code}' https://127.0.0.1:"$APP_PORT"/healthz || true)
              echo "tls check $i: $code"; [ "$code" = 200 ] && exit 0; sleep 3
            done
            docker logs --tail 30 shortly; exit 1
